# Copy this file to ~/.navigo-justificatif/config.toml and fill in your values.
# (Or pass --config /path/to/config.toml to every command.)
# This file is never read from the repo directory — nothing personal lives here.

# Where downloaded justificatif PDFs are saved, as "<output_dir>/YYYY-MM.pdf".
output_dir = "~/Navigo-justificatifs"

# Page opened during `bootstrap` for you to log in.
login_url = "https://www.iledefrance-mobilites.fr/mon-compte"

# The page listing your justificatifs/attestations, once logged in.
# Log in manually once, go to "Mon compte" > your purchases/Navigo pass, and
# copy that URL here.
justificatif_page_url = "https://www.iledefrance-mobilites.fr/CHANGE_ME"

# Optional: only needed if `navigo.py fetch` can't find the download link on
# its own. Run `navigo.py fetch --headed --month YYYY-MM` once to see the
# actual page and adjust this.
[selectors]
download_link_text = "Télécharger"

# Optional: prefill an HR reimbursement form (e.g. a Google Form) after
# download. Leave this whole section out to skip `navigo.py prefill`.
[hr_form]
# Base form URL (without query string). For Google Forms, use the plain
# ".../viewform" URL — see the form's own "Get pre-filled link" feature to
# discover the entry.<id> for each field below.
base_url = "https://docs.google.com/forms/d/e/FORM_ID/viewform"
amount = "38.55"
name = "Jane Doe"

[hr_form.fields]
# Map each entry.<id> to a value. "{month}", "{amount}", "{name}" are
# substituted from the values above.
# "entry.111111111" = "{name}"
# "entry.222222222" = "{month}"
# "entry.333333333" = "{amount}"
