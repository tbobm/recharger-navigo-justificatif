[project]
name = "navigo-justificatif"
version = "0.1.0"
description = "Download your monthly Île-de-France Mobilités (Navigo) justificatif and optionally prefill an HR reimbursement form."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["playwright>=1.45"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.3",
]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = ["S603", "S607"]  # subprocess calls here use fixed, non-shell argv lists

[tool.ruff.lint.per-file-ignores]
"navigo.py" = ["S310"]  # webbrowser.open() with a fixed https:// base_url, not user input
